<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagem 3D</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="rotate-overlay">
    <p>Por favor, rode o dispositivo para o modo retrato.</p>
  </div>

  <header class="site-header">
    <h1>Personagem 3D</h1>
  </header>

  <main>
    <div id="viewer">
      <canvas id="viewer-canvas"></canvas>
      <div id="viewer-loading">Carregando personagem...</div>
    </div>

    <section id="training-panel">
      <div id="start-screen" class="panel-screen">
        <button id="btn-start-treino" class="btn-primary">Iniciar Treino</button>
      </div>

      <div id="training-screen" class="panel-screen hidden">
        <p class="training-label">Distância percorrida</p>
        <p id="training-distance" class="training-distance">0 m</p>
        <button id="btn-stop-treino" class="btn-secondary">Parar Treino</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Personagem 3D</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/training.js"></script>
</body>
</html>
